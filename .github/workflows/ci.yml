name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Lint
        run: npm run lint:fix

      - name: Format
        run: npm run format

      - name: Test
        run: npm run test:coverage
